name: Daily Study Plan

permissions:
  contents: write

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-plan.yml'
      - 'work/*.ps1'
  schedule:
    - cron: '5,20,35,50 23 * * *'
  workflow_dispatch:

concurrency:
  group: daily-study-plan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  send:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run daily plan sender
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PUBLISH_IMAGE_TO_REPO: '1'
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_SECRET_KEY: ${{ secrets.PUSHPLUS_SECRET_KEY }}
          PUSHPLUS_ENDPOINT: ${{ secrets.PUSHPLUS_ENDPOINT }}
          PUSHPLUS_CHANNEL: ${{ secrets.PUSHPLUS_CHANNEL }}
        run: |
          $result = & .\work\Send-DailyPlan.ps1
          $result
